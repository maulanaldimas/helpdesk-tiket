{% extends 'tickets/base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="mb-6">
        <h1 class="page-title">Reset Password</h1>
        <p class="page-sub mt-1">Set password baru untuk user <span class="font-mono font-medium text-slate-700">{{ target_user.username }}</span>.</p>
    </div>

    <form method="post" class="card p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label class="label">Password Baru</label>
            <input type="password" name="new_password" required minlength="8">
            <p class="text-xs text-slate-400 mt-1">Minimal 8 karakter. Beri tahu user password sementara ini.</p>
        </div>
        <div class="flex gap-2 pt-2">
            <button type="submit" class="btn btn-primary">Reset Password</button>
            <a href="{% url 'user_list' %}" class="btn btn-secondary">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
