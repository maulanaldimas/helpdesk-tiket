{% extends 'tickets/base.html' %}

{% block title %}Email Terkirim{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-10 sm:mt-16 text-center">
    <div class="card p-8">
        <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4Z"/>
            </svg>
        </div>
        <h1 class="page-title text-lg">Email Terkirim</h1>
        <p class="text-sm text-slate-500 mt-2">
            Jika ada akun dengan email tersebut, Anda akan menerima tautan untuk reset password dalam beberapa menit.
        </p>
        <p class="text-sm text-slate-500 mt-1">Cek juga folder spam/junk.</p>
    </div>
    <p class="text-xs text-slate-400 mt-6">
        <a href="{% url 'login' %}" class="text-indigo-600 hover:text-indigo-500 font-medium">&larr; Kembali ke Login</a>
    </p>
</div>
{% endblock %}
