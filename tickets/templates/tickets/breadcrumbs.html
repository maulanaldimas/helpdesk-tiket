{% if breadcrumbs %}
<nav class="flex items-center gap-1.5 text-xs text-slate-400 mb-4">
    <a href="{% url 'dashboard' %}" class="hover:text-slate-600 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    {% for cr in breadcrumbs %}
        <span class="text-slate-300">/</span>
        {% if cr.url %}
            <a href="{{ cr.url }}" class="hover:text-slate-600 transition">{{ cr.label }}</a>
        {% else %}
            <span class="text-slate-600 font-medium">{{ cr.label }}</span>
        {% endif %}
    {% endfor %}
</nav>
{% endif %}
