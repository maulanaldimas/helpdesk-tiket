x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  DEBUG: ${DEBUG:-false}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  SITE_URL: ${SITE_URL:-http://localhost:8000}
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: helpdesk
  DB_USER: helpdesk
  DB_PASSWORD: ${DB_PASSWORD:-helpdesk-secret}
  DB_HOST: db
  DB_PORT: "5432"
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-helpdesk@localhost}
  TIME_ZONE: ${TIME_ZONE:-Asia/Jakarta}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk-secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/maulanaldimas/helpdesk-tiket:latest
    build: .
    restart: unless-stopped
    command: gunicorn helpdesk.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile -
    environment: *app-env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/maulanaldimas/helpdesk-tiket:latest
    build: .
    restart: unless-stopped
    command: sh -c "while true; do python manage.py sla_check; sleep 3600; done"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  media_data:
  static_data:
